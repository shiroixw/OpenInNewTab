<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Open In New Tab - Options</title>
        <link rel="stylesheet" href="options.css" />
    </head>
    <body>
        <div class="options-container">
            <header class="options-header">
                <div class="header-content">
                    <h1 id="optionsTitle">Extension Settings</h1>
                </div>
            </header>

            <main class="options-main">
                <!-- Theme & Language Section -->
                <section class="settings-section">
                    <h2 class="section-heading" id="appearanceHeading">
                        Appearance & Language
                    </h2>
                    <div class="settings-card">
                        <!-- Theme Setting -->
                        <div class="setting-row">
                            <div class="setting-info">
                                <label class="setting-title" id="themeLabel"
                                    >Theme</label
                                >
                            </div>
                            <div class="theme-toggle-group">
                                <button
                                    class="theme-option"
                                    data-theme="light"
                                    id="themeLightBtn"
                                    title="Light"
                                    aria-label="Light"
                                >
                                    <svg class="icon theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <circle cx="12" cy="12" r="4" />
                                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                                    </svg>
                                </button>
                                <button
                                    class="theme-option"
                                    data-theme="dark"
                                    id="themeDarkBtn"
                                    title="Dark"
                                    aria-label="Dark"
                                >
                                    <svg class="icon theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                                    </svg>
                                </button>
                                <button
                                    class="theme-option"
                                    data-theme="auto"
                                    id="themeAutoBtn"
                                    title="Auto"
                                    aria-label="Auto"
                                >
                                    <svg class="icon theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <rect width="20" height="14" x="2" y="3" rx="2" />
                                        <path d="M8 21h8M12 17v4" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="divider"></div>

                        <!-- Language Setting -->
                        <div class="setting-row">
                            <div class="setting-info">
                                <label
                                    class="setting-title"
                                    id="languageLabel"
                                    >Language</label
                                >
                            </div>
                            <select id="languageSelect" class="language-select">
                                <option value="en">English</option>
                                <option value="zh-CN">简体中文</option>
                                <option value="zh-TW">繁體中文</option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Link behavior -->
                <section class="settings-section">
                    <h2 class="section-heading" id="linkBehaviorHeading">
                        Link behavior
                    </h2>
                    <div class="settings-card">
                        <div class="setting-row">
                            <div class="setting-info">
                                <div class="setting-copy">
                                    <label
                                        class="setting-title"
                                        id="openInBackgroundLabel"
                                        >Open in background</label
                                    >
                                    <span class="setting-hint">
                                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <circle cx="12" cy="12" r="10" />
                                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                                            <path d="M12 17h.01" />
                                        </svg>
                                        <span
                                            class="setting-hint-tooltip"
                                            role="tooltip"
                                            id="openInBackgroundDesc"
                                            >Keep focus on the current tab when
                                            opening links</span
                                        >
                                    </span>
                                </div>
                            </div>
                            <label class="toggle-switch" title="Open in background">
                                <input
                                    type="checkbox"
                                    id="openInBackgroundToggle"
                                    aria-label="Open in background"
                                    aria-describedby="openInBackgroundDesc"
                                />
                                <span
                                    class="toggle-slider"
                                    aria-hidden="true"
                                ></span>
                            </label>
                        </div>

                        <div class="divider"></div>

                        <!-- Visited-link marking -->
                        <div class="setting-row">
                            <div class="setting-info">
                                <div class="setting-copy">
                                    <label
                                        class="setting-title"
                                        id="markVisitedLinksLabel"
                                        >Mark visited links</label
                                    >
                                    <span class="setting-hint">
                                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <circle cx="12" cy="12" r="10" />
                                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                                            <path d="M12 17h.01" />
                                        </svg>
                                        <span
                                            class="setting-hint-tooltip"
                                            role="tooltip"
                                            id="markVisitedLinksDesc"
                                            >Recolor links you opened from this
                                            extension</span
                                        >
                                    </span>
                                </div>
                            </div>
                            <label
                                class="toggle-switch"
                                title="Mark visited links"
                            >
                                <input
                                    type="checkbox"
                                    id="markVisitedLinksToggle"
                                    aria-label="Mark visited links"
                                    aria-describedby="markVisitedLinksDesc"
                                />
                                <span
                                    class="toggle-slider"
                                    aria-hidden="true"
                                ></span>
                            </label>
                        </div>

                    </div>
                </section>

                <!-- Whitelist Management Section -->
                <section class="settings-section">
                    <h2 class="section-heading" id="whitelistHeading">
                        Whitelist Management
                    </h2>
                    <div class="settings-card">
                        <!-- Import/Export -->
                        <div class="setting-row">
                            <div class="setting-info">
                                <label
                                    class="setting-title"
                                    id="importExportLabel"
                                    >Import / Export</label
                                >
                            </div>
                            <div class="button-group">
                                <button id="exportBtn" class="action-btn">
                                    <span id="exportBtnText">Export</span>
                                </button>
                                <button id="importBtn" class="action-btn">
                                    <span id="importBtnText">Import</span>
                                </button>
                                <input
                                    type="file"
                                    id="importFileInput"
                                    accept=".json"
                                    style="display: none"
                                />
                            </div>
                        </div>

                        <div class="divider"></div>

                        <!-- Add Domain -->
                        <div class="setting-row">
                            <div class="setting-info">
                                <label class="setting-title" id="addDomainLabel"
                                    >Add Domain</label
                                >
                            </div>
                            <div class="input-with-button">
                                <input
                                    type="text"
                                    id="newDomainInput"
                                    placeholder="example.com"
                                />
                                <button id="addDomainBtn" class="add-btn">
                                    <span id="addBtnText">Add</span>
                                </button>
                            </div>
                        </div>

                        <div class="divider"></div>

                        <!-- Domains List -->
                        <div class="domains-container">
                            <div class="domains-header">
                                <span class="domains-count" id="domainsCount"
                                    >0 domains</span
                                >
                            </div>
                            <div id="domainsList" class="domains-list">
                                <!-- Domains will be added here -->
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <footer class="options-footer">
                <div class="footer-content">
                    <span id="footerText"></span>
                </div>
            </footer>
        </div>

        <script src="i18n-bundle.js"></script>
        <script src="theme.js"></script>
        <script src="options.js"></script>
    </body>
</html>
