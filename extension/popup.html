<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Open In New Tab - Whitelist Manager</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <h1 id="modalTitle">Whitelist Management</h1>
                <div class="header-buttons">
                    <button
                        id="settingsButton"
                        class="settings-btn"
                        title="Settings"
                    >
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </header>

            <main class="main-content">
                <!-- Quick Add Current Domain Section -->
                <div class="quick-add-section" id="quickAddSection">
                    <div class="current-domain-card">
                        <div class="domain-info">
                            <span class="domain-label" id="currentDomainLabel"
                                >Current Domain:</span
                            >
                            <span class="domain-value" id="currentDomainValue"
                                >Loading...</span
                            >
                        </div>
                        <button
                            id="quickAddBtn"
                            class="quick-add-btn"
                            title="Add current domain to whitelist"
                        >
                            <span id="quickAddBtnText">Add</span>
                        </button>
                    </div>
                    <p class="domain-hint" id="restrictedHint" hidden></p>
                </div>

                <div class="domains-section">
                    <div class="section-title" id="whitelistTitle">
                        Whitelist
                    </div>
                    <div id="domainsList" class="domains-list">
                        <!-- Domains will be added here -->
                    </div>
                </div>
            </main>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="settingsTitle">Settings</h2>
                    <button
                        id="modalCloseBtn"
                        class="modal-close-btn"
                        aria-label="Close settings"
                    >
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 6 6 18M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Theme Setting -->
                    <div class="setting-item">
                        <label class="setting-label" id="themeLabel"
                            >Theme</label
                        >
                        <div class="theme-toggle-group">
                            <button
                                class="theme-option"
                                data-theme="light"
                                id="themeLightBtn"
                            >
                                <svg class="icon theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="4" />
                                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                                </svg>
                                <span class="theme-text" id="themeLightText"
                                    >Light</span
                                >
                            </button>
                            <button
                                class="theme-option"
                                data-theme="dark"
                                id="themeDarkBtn"
                            >
                                <svg class="icon theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                                </svg>
                                <span class="theme-text" id="themeDarkText"
                                    >Dark</span
                                >
                            </button>
                            <button
                                class="theme-option"
                                data-theme="auto"
                                id="themeAutoBtn"
                            >
                                <svg class="icon theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect width="20" height="14" x="2" y="3" rx="2" />
                                    <path d="M8 21h8M12 17v4" />
                                </svg>
                                <span class="theme-text" id="themeAutoText"
                                    >Auto</span
                                >
                            </button>
                        </div>
                    </div>

                    <!-- Language Setting -->
                    <div class="setting-item">
                        <label class="setting-label" id="languageLabel"
                            >Language</label
                        >
                        <select id="languageSelect" class="language-select">
                            <option value="en">English</option>
                            <option value="zh-CN">简体中文</option>
                            <option value="zh-TW">繁體中文</option>
                        </select>
                    </div>

                    <!-- Open in background -->
                    <div class="setting-item setting-item-row">
                        <div class="setting-copy">
                            <span
                                class="setting-label setting-label-inline"
                                id="openInBackgroundLabel"
                                >Open in background</span
                            >
                            <span class="setting-hint">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                                    <path d="M12 17h.01" />
                                </svg>
                                <span
                                    class="setting-hint-tooltip"
                                    role="tooltip"
                                    id="openInBackgroundDesc"
                                    >Keep focus on the current tab when opening
                                    links</span
                                >
                            </span>
                        </div>
                        <label class="toggle-switch" title="Open in background">
                            <input
                                type="checkbox"
                                id="openInBackgroundToggle"
                                aria-label="Open in background"
                                aria-describedby="openInBackgroundDesc"
                            />
                            <span class="toggle-slider" aria-hidden="true"></span>
                        </label>
                    </div>

                    <!-- Entry to the full options page -->
                    <button id="moreOptionsBtn" class="more-options-row">
                        <span id="moreOptionsText">More settings</span>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <script src="i18n-bundle.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
